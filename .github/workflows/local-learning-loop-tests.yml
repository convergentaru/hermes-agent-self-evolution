name: Local verified learning loop tests

on:
  push:
    branches:
      - main
      - feat/local-verified-learning-loop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test runner only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run learning loop unit tests
        run: python -m pytest tests/core/test_learning_loop.py -q
